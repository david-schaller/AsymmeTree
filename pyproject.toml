[project]
name = "asymmetree"
description = "Simulation of phylogenetic trees, sequences and genomes"
readme = "README.md"
authors = [
    { name = "David Schaller", email = "38377210+david-schaller@users.noreply.github.com" }
]
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.8",
    "networkx>=3.4.2",
    "numpy>=2.2.6",
    "scipy>=1.15.3",
    "tralda==1.1.1",
]
dynamic = ["version"]
keywords = [
    "tree",
    "simulation",
    "evolution",
    "phylogenetic trees",
    "phylogenetics",
    "gene families",
    "species trees",
    "sequence simulation",
    "horizontal gene transfer",
    "HGT",
    "gene duplication",
    "gene loss",
]

[project.urls]
Repository = "https://github.com/david-schaller/AsymmeTree.git"
Issues = "https://github.com/david-schaller/AsymmeTree/issues"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["asymmetree*"]

[tool.setuptools.dynamic.version]
attr = "asymmetree.__version__"

[tool.ruff]
line-length = 100
target-version = "py310"
