      --line: #d8d4c5;
      --accent: #d4a72c;
      --shadow: 0 18px 40px rgba(23, 32, 51, 0.12);
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Avenir Next", "Segoe UI", sans-serif;

      background:

        linear-gradient(180deg, #faf7ef 0%, #f2ede0 100%);
    }
    .app {
      display: grid;
      grid-template-columns: 360px 1fr;
      min-height: 100vh;
    }
    .sidebar {
      padding: 24px 22px 18px;
      background: rgba(255, 253, 248, 0.94);
      border-right: 1px solid var(--line);
      box-shadow: var(--shadow);
      position: relative;
      z-index: 2;
      overflow: auto;
    }
    .sidebar h1 {
      margin: 0;
      font-size: 1.55rem;
      letter-spacing: -0.03em;
    }
    .lead {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.45;
      font-size: 0.95rem;
    }
    .controls {
      margin-top: 20px;
      display: grid;
      gap: 10px;
    }
    .controls input[type="search"] {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      font: inherit;
    }
    .controls label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.94rem;
      color: var(--ink);
    }
    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      border: 1px solid #c9bc92;
      background: linear-gradient(180deg, #f7e7b0, #efd27e);
      color: #493300;
      padding: 9px 12px;
      border-radius: 999px;
      cursor: pointer;
      font: inherit;
      font-weight: 600;
    }
    .legend {
      margin-top: 20px;
      display: grid;
      gap: 8px;
    }
    .legend-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.93rem;
      color: var(--muted);
    }
    .swatch {
      width: 13px;
      height: 13px;
      border-radius: 999px;
      border: 1px solid rgba(23, 32, 51, 0.15);
      flex: 0 0 auto;
    }
    .stats, .details {
      margin-top: 20px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 10px 24px rgba(23, 32, 51, 0.06);
    }
    .details h2 {
      margin: 0 0 8px;
      font-size: 1rem;
    }
    .meta {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .details p {
      margin: 10px 0 0;
      line-height: 1.5;
      font-size: 0.94rem;
    }
    .list {
      margin: 12px 0 0;
      padding-left: 18px;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .stage {
      position: relative;
      overflow: hidden;
    }
    svg {
      width: 100%;
      height: 100vh;
      display: block;
      cursor: grab;
    }
    svg.dragging {
      cursor: grabbing;
    }
    .lane-band {
      rx: 28px;
    }
    .lane-label {
      font-size: 16px;
      font-weight: 700;
      fill: #41506a;
    }
    .edge {
      fill: none;
      stroke-width: 2.1;
      opacity: 0.72;
    }
    .edge.calls {
      stroke: #394354;
    }
    .edge.constructs {
      stroke: #8c4f00;
      stroke-dasharray: 8 6;
    }
    .edge.contains,
    .edge.imports,
    .edge.reexports {
      stroke: #b8b4a6;
      stroke-dasharray: 5 7;
      opacity: 0.55;
    }
    .node-rect {
      stroke-width: 1.5;
      filter: drop-shadow(0 10px 18px rgba(23, 32, 51, 0.08));
    }
    .node-label {
      font-size: 13px;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
      fill: #172033;
      font-weight: 600;
    }
    .node.module .node-label {
      font-size: 14px;
      font-weight: 700;
    }
    .dimmed {
      opacity: 0.13 !important;
    }
    .hidden {
      display: none;
    }
    .selected .node-rect {
      stroke: #172033;
      stroke-width: 2.6;
    }
    .selected-edge {
      stroke-width: 3.4;
      opacity: 0.95;
    }
    .hint {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.45;
    }
    @media (max-width: 980px) {
      .app {
        grid-template-columns: 1fr;
      }
      .sidebar {
        border-right: none;
        border-bottom: 1px solid var(--line);
      }
      svg {
        height: 72vh;
      }
    }
  </style>
</head>

  <div class="app">
    <aside class="sidebar">
      <h1>Dependency Diagram</h1>
      <p class="lead">
        Static call/dependency view rooted in <code>example_simulations.py</code>. The default
        view emphasizes the local script plus the <code>asymmetree.hologenome</code> and
        <code>asymmetree.holoevolve</code> paths it triggers.
      </p>

      <div class="controls">
        <input id="search" type="search" placeholder="Search modules, functions, methods...">
        <label><input id="showExternal" type="checkbox"> Show external dependencies</label>
        <label><input id="showPrivate" type="checkbox" checked> Show private helpers</label>
        <label><input id="showStructure" type="checkbox" checked> Show contains / import edges</label>
        <div class="button-row">
          <button id="resetView" type="button">Reset View</button>
          <button id="clearSelection" type="button">Clear Selection</button>
        </div>
      </div>

      <div class="legend" id="legend"></div>
      <div class="stats" id="stats"></div>
      <div class="details" id="details">
        <h2>Selection</h2>
        <p class="hint">Click a node to inspect its callers, callees, file location, and docstring.</p>
      </div>
    </aside>

    <main class="stage">
      <svg id="graph" viewBox="0 0 1800 1200" aria-label="Dependency diagram">
        <g id="viewport"></g>
      </svg>
    </main>
  </div>

      "endLineno": 220,
      "doc": "Simulate a gene tree along the specified species tree.\n\nArgs:\n    dupl_rate: Duplication rate, default is 0.0.\n    loss_rate: Loss rate, default is 0.0.\n    hgt_rate: Horizontal gene transfer rate, default is 0.0.\n    gc_rate: Gene conversion rate, default is 0.0.\n    dupl_polytomy: Allows non-binary duplication events by specifying the lambda parameter\n        for a poisson distribution (copy number = drawn number + 2); default is 0.0.\n    prohibit_extinction: Avoid the extinction of all members in any species ('per_species'),\n        of the complete gene family ('per_family'), or no constraints (False); default is\n        'per_species'.\n    replace_prob: Enables replacing HGT events, probability by which one random homolog in\n        the receiving branch of the receiving branch gets lost immediately after the\n        transfer. The default is 0.0, in which case all HGT events are additive.\n    additive_transfer_distance_bias: Specifies whether closer related species have a higher\n        probability to be the recipient species in an additive HGT event. The default is\n        None, in which case the recipient species is chosen at random among the co-existing\n        species. The options 'inverse' and 'exponential' mean that a species branch is\n        sampled weighted by 1/(a * t) or e^(-(a * t)), resp., where t is the elapsed time\n        between the last common ancestor of the two species branches and the time of the\n        event, see [1], and a is a user-defined factor.\n    replacing_transfer_distance_bias: Specifies whether closer related gene branches have a\n        higher probability to be replaced in a replacing HGT event. The default is None, in\n        which case the replaced gene is chosen at random among the co-existing gene\n        branches. The options 'inverse' and 'exponential' mean that a gene branch is sampled\n        weighted by 1/(a * t) or e^(-(a * t)), resp., where t is the elapsed time between\n        the last common ancestor of the two gene branches and the time of the event, see\n        [1], and a is a user-defined factor.\n    transfer_distance_bias: Set a common bias mode for additive and replacing HGT, see\n        description of parameters 'additive_transfer_distance_bias' and\n        'replacing_transfer_distance_bias'. This parameter is used if the bias mode shall be\n        the same for both types of HGT and the respective parameters are not set, and\n        overrides the default bias mode for replacing HGT.\n    transfer_distance_bias_strength: Intensity of the transfer distance bias (factor a) for\n        additive and replacing HGT, default is 1.0.\n    gc_distance_bias: Specifies whether closer related gene branches have a higher\n        probability to be replaced in a gene conversion event. The default is None, in which\n        case the replaced gene is chosen at random among the paralogs in the respective\n        species lineage. The options 'inverse' and 'exponential' mean that a paralog is\n        sampled weighted by 1/(a * t) or e^(-(a * t)), resp., where t is the elapsed time\n        between the last common ancestor of the two gene branches and the time of the event,\n        see [1], and a is a user-defined factor.\n    gc_distance_bias_strength: Intensity of the distance bias (factor a) for gene\n        conversion, default is 1.0.\n    delta_l: Multiplicative factor used for homolog-homolog loss interactions in auxiliary\n        trees. A transfer into an auxiliary branch multiplies loss rates according to rules\n        A0-A2, while a later loss of an interacting branch divides surviving partners'\n        loss rates by the same factor. The default is 2.0.\n\nReturns:\n    The simulated gene tree.\n\nReferences:\n    1. S. Kundu, M. S. Bansal. SaGePhy: an improved phylogenetic simulation framework\n       for gene and subgene evolution. In: Bioinformatics, 35(18), 2019, 3496-3498.\n       doi:10.1093/bioinformatics/btz081.",

      "endLineno": 202,
      "doc": "Simulate a gene tree along the specified species tree.\n\nArgs:\n    dupl_rate: Duplication rate, default is 0.0.\n    loss_rate: Loss rate, default is 0.0.\n    hgt_rate: Horizontal gene transfer rate, default is 0.0.\n    gc_rate: Gene conversion rate, default is 0.0.\n    dupl_polytomy: Allows non-binary duplication events by specifying the lambda parameter\n        for a poisson distribution (copy number = drawn number + 2); default is 0.0.\n    prohibit_extinction: Avoid the extinction of all members in any species ('per_species'),\n        of the complete gene family ('per_family'), or no constraints (False); default is\n        'per_species'.\n    replace_prob: Enables replacing HGT events, probability by which one random homolog in\n        the receiving branch of the receiving branch gets lost immediately after the\n        transfer. The default is 0.0, in which case all HGT events are additive.\n    additive_transfer_distance_bias: Specifies whether closer related species have a higher\n        probability to be the recipient species in an additive HGT event. The default is\n        None, in which case the recipient species is chosen at random among the co-existing\n        species. The options 'inverse' and 'exponential' mean that a species branch is\n        sampled weighted by 1/(a * t) or e^(-(a * t)), resp., where t is the elapsed time\n        between the last common ancestor of the two species branches and the time of the\n        event, see [1], and a is a user-defined factor.\n    replacing_transfer_distance_bias: Specifies whether closer related gene branches have a\n        higher probability to be replaced in a replacing HGT event. The default is None, in\n        which case the replaced gene is chosen at random among the co-existing gene\n        branches. The options 'inverse' and 'exponential' mean that a gene branch is sampled\n        weighted by 1/(a * t) or e^(-(a * t)), resp., where t is the elapsed time between\n        the last common ancestor of the two gene branches and the time of the event, see\n        [1], and a is a user-defined factor.\n    transfer_distance_bias: Set a common bias mode for additive and replacing HGT, see\n        description of parameters 'additive_transfer_distance_bias' and\n        'replacing_transfer_distance_bias'. This parameter is used if the bias mode shall be\n        the same for both types of HGT and the respective parameters are not set, and\n        overrides the default bias mode for replacing HGT.\n    transfer_distance_bias_strength: Intensity of the transfer distance bias (factor a) for\n        additive and replacing HGT, default is 1.0.\n    gc_distance_bias: Specifies whether closer related gene branches have a higher\n        probability to be replaced in a gene conversion event. The default is None, in which\n        case the replaced gene is chosen at random among the paralogs in the respective\n        species lineage. The options 'inverse' and 'exponential' mean that a paralog is\n        sampled weighted by 1/(a * t) or e^(-(a * t)), resp., where t is the elapsed time\n        between the last common ancestor of the two gene branches and the time of the event,\n        see [1], and a is a user-defined factor.\n    gc_distance_bias_strength: Intensity of the distance bias (factor a) for gene\n        conversion, default is 1.0.\n\nReturns:\n    The simulated gene tree.\n\nReferences:\n    1. S. Kundu, M. S. Bansal. SaGePhy: an improved phylogenetic simulation framework\n       for gene and subgene evolution. In: Bioinformatics, 35(18), 2019, 3496-3498.\n       doi:10.1093/bioinformatics/btz081.",

      "lineno": 335,
      "endLineno": 402,
      "doc": "Introduce multifurcation into a tree by contraction of inner edges.\n\nArgs:\n    tree: The tree whose edges shall be contracted.\n    contraction_probability: Probability that an inner edge is contracted; results in non-binary\n        tree; default is 0.0. Only one of this parameter and 'contraction_proportion' may be\n        non-zero.\n    contraction_proportion: The proportion of inner edges to be contracted; results in\n        non-binary tree; default is 0.0. Only one of this parameter and\n        'contraction_probability' may be non-zero.\n    contraction_bias: Specifies whether shorter edges, i.e., with a smaller difference t of the\n        time stamps, have a higher probability to be contracted. Only relevant if\n        'contraction_proportion' > 0.0. The default is None, in which case all edges have the\n        same probability to be contracted. The options 'inverse' and 'exponential' mean that an\n        edge is sampled weighted by 1/(a * t) or e^(-a * t), respectively, where a is a\n        user-defined factor.\n    bias_strength: Intensity factor for preferring shorter edges to be contracted.\n    inplace: If True, the edges are contracted in the original tree instance; otherwise a copy\n        of the tree in which edges are contracted is returned.\n\nReturns:\n    The tree whose edges have been contracted according to the parameters.\n\nRaises:\n    ValueError: If both contraction_probability and contraction_proportion are non-zero or do\n        not lie in the interval [0, 1].",

      "lineno": 20,
      "endLineno": 134,
      "doc": "Simulates a species tree S with n leaves.\n\nThe tree is sampled under the Yule, BDP, or EBDP model conditioned on the number n of surviving\nspecies [1, 2, 3].\n\nArgs:\n    n: Number of leaves in the resulting tree that correspond to extant species.\n    model: Simulation model to be applied, the default is 'yule', see [1]. Other available\n        models are birth-death process ('BDP', [2]), and episodic birth-death process ('EBDP',\n        [3]).\n    innovation: If True, use the innovation model, see [4], to sample a lineage for the next\n        speciation event. Only available for the Yule model. The default is False, in which case\n        the lineage is chosen uniformly at random among the currently existing lineages.\n        The innovation model is not available for the BDP and EBDP models.\n    planted: Add a planted root that has the canonical root as its single neighbor.\n    remove_extinct: Remove all branches that lead to extinctions, only relevant for some models.\n    birth_rate: The birth rate for models such as 'yule' and 'BDP'. The default is None, in\n        which case the birth rate is set to 1.0 unless episodes are specified.\n    death_rate: The death rate for models such as 'BDP'. The default is None, in which case the\n        death rate is set to 0.0 unless episodes are specified.\n    episodes: The episodes for the model 'EBDP'.\n    contraction_probability: Probability that an inner edge is contracted. The default is 0.0,\n        in which case the tree is binary. Only one of this parameter and\n        'contraction_proportion' may be non-zero.\n    contraction_proportion: The proportion of inner edges to be contracted. The default is 0.0,\n        in which case the tree is binary. Only one of this parameter and\n        'contraction_probability' may be non-zero.\n    contraction_bias: Specifies whether shorter edges, i.e., with a smaller difference t of the\n        time stamps, have a higher probability to be contracted. Only relevant if\n        'contraction_proportion' > 0.0. The default is None, in which case all edges have the\n        same probability to be contracted. The options 'inverse' and 'exponential' mean that an\n        edge is sampled weighted by 1/t or e^(-t), respectively.\n    bias_strength: Intensity factor for preferring shorter edges to be contracted. The default\n        is 1.0.\n\nRaises:\n    ValueError: If unknown or invalid parameter values are passed.\n    ValueError: If the innovation model is selected for a model that does not support it.\n\nReturns:\n    The simulated species tree.\n\nReferences:\n    1. G. U. Yule. A mathematical theory of evolution, based on the conclusions of Dr. J.\n       C. Willis, F. R. S. In: Phil. Trans. R. Soc. Lond. B, 1924, 213, 21-87.\n       doi:10.1098/rstb.1925.0002.\n    2. D. G. Kendall. On the Generalized \"Birth-and-Death\" Process. In: Ann. Math. Statist.\n       1948, 19, 1-15. doi:10.1214/aoms/1177730285.\n    3. T. Stadler. Simulating trees with a fixed number of extant species. In: Syst. Biol.\n       2011, 60, 676-684. doi:10.1093/sysbio/syr029.\n    4. S. Keller-Schmidt, K. Klemm. A model of macroevolution as a branching process based\n       on innovations. In: Adv. Complex Syst.,2012, 15, 1250043. doi:10.1142/S0219525912500439.",

      "lineno": 1,
      "endLineno": 1250,
      "doc": "Orthology graph, BMG, RBMG.\n\nThis module provides classes concerning colored graphs and colored (phylogenetic) trees, including\na BMG(Tree)-function, and computation of anLRT from a (not necessarily valid) BMG or from a\n(pruned) gene tree.\n\nPhylogenetic best matches of a gene x of species X are defined as those genes y of another species\nY that share the lowest common ancestor with x in the gene tree among all genes in that species.\nIn contrast, two genes are orthologs if their last common ancestor was a speciation event.\nOrthology and reciprocal best matches are closely related. The module asymmetree.analysis.\nBestMatches contains methods for extracting BMGs from trees, least resolved trees of BMG, and\northology graphs from trees.",

      "path": "asymmetree/analysis/horizontal_gene_transfer.py",
      "lineno": 1,
      "endLineno": 871,
      "doc": "Horizontal gene transfer (HGT), xenology and Fitch graphs.\n\nThis module contains several functions for the analysis of horizontal gene transfer events in the\nsimulated scenarios. In particular, the directed and undirected Fitch graph can be extracted, as\nwell as the pairs of genes that diverged later than the respective species in which they reside,\ni.e., the later-divergence-time (LDT) graph, see [1]. The latter situation is indicative of the\npresence of HGT events in the scenario.\n\nReferences:\n    1. D. Schaller, M. Lafond, P.F. Stadler, N. Wieseke, M. Hellmuth. Indirect identification of\n       horizontal gene transfer. In: Journal of Mathematical Biology, 2021, 83(1):10.\n       doi: 10.1007/s00285-021-01631-0.",

      "path": "asymmetree/holoevolve/__init__.py",
      "lineno": 1,
      "endLineno": 35,
      "doc": "Simulation of species and gene trees.\n\nThe subpackage asymmetree.holoevolve contains modules for the simulation and manipulation of\nspecies trees and gene trees. A typical simulation consists of the following steps:\n\n(1) dated species tree (models e.g. 'Yule', and '(episodic) birth-death process')\n\n(2) dated gene tree(s) (birth-death process with speciations as additional branching events)\n\n(3) assignment of asymmetric evolution rates to paralogous genes\n\n(4) pruned gene tree(s) (removal of all branches that lead to losses only)\n\nIn terms of divergence time, these trees define an ultrametric on the set of their (extant) leaves.\nGene trees, furthermore, can be manipulated with a realistic rate heterogeneity among their branches\n(step 3) resulting in general additive distances (but no longer ultrametric).",
      "private": false,
      "external": false,
      "distance": 0,
      "x": 1030.0,
      "y": 120,
      "width": 196,
      "height": 52

      "color": "#2f9e44",
      "path": "asymmetree/holoevolve/distance_noise.py",
      "lineno": 1,
      "endLineno": 356,
      "doc": "Simulation of noisy distance matrices.\n\nDistances derived from (real-life) gene or protein sequences are burdened with noise. Such data can\neither be modeled by simulating sequences, or by disturbing the distances specified by a given tree\ndirectly. This module implements functions for the latter alternative.",

      "lineno": 1,
      "endLineno": 852,
      "doc": "Simulation of dated gene trees.\n\nThis module contains the class GeneTreeSimulator for simulating dated gene trees along a given dated\nspecies tree. The simulation is based on a birth-death process with speciations as additional\nbranching events, and allows for the simulation of gene duplications, losses, horizontal gene\ntransfers, and gene conversions. A pruning function is provided to remove all branches that lead to\nlosses only, and to suppress superfluous vertices.",

      "doc": "Evolution rate heterogeneity.\n\nThis module contains functions to introduce evolution rate asymmetries and autocorrelation. The main\nfunction is 'rate_heterogeneity()', which modifies the edge lengths of a gene tree according to\nthree sources of heterogeneity: (i) gene-family-specific heterogeneity, (ii) species-specific\nheterogeneity, and (iii) paralog-specific heterogeneity. The function 'gene_trees()' can be used to\nsimulate gene trees with rate heterogeneity along a species tree.",

      "doc": "Substitution models for nucleotide and amino acid evolution.\n\nThe module contains the class `SubstModel` that can be used to represent a substitution model\nfor nucleotide or amino acid evolution. The class provides methods to compute the transition\nprobability matrix for a given time and to convert sequences between their str representation and a\nlist of indices.\n\nFor amino acid substitution models, some empirical models are available that can be loaded via the\n`EMPIRICAL_MODELS` object. The values in the matrices and the equilibrium frequencies are\ntaken from [2].\n\nReferences:\n    1. Z. Yang. Computational molecular evolution. Oxford series in ecology and evolution.\n       Oxford University Press, 2006. ISBN 978-0-19-856699-1 978-0-19-856702-8.\n    2. http://giphy.pasteur.fr/empirical-models-of-amino-acid-substitution/",

      "lineno": 1,
      "endLineno": 35,
      "doc": "Simulation of species and gene trees.\n\nThe subpackage asymmetree.treeevolve contains modules for the simulation and manipulation of species\ntrees and gene trees. A typical simulation consists of the following steps:\n\n(1) dated species tree (models e.g. 'Yule', and '(episodic) birth-death process')\n\n(2) dated gene tree(s) (birth-death process with speciations as additional branching events)\n\n(3) assignment of asymmetric evolution rates to paralogous genes\n\n(4) pruned gene tree(s) (removal of all branches that lead to losses only)\n\nIn terms of divergence time, these trees define an ultrametric on the set of their (extant) leaves.\nGene trees, furthermore, can be manipulated with a realistic rate heterogeneity among their branches\n(step 3) resulting in general additive distances (but no longer ultrametric).",

      "doc": "Simulation of noisy distance matrices.\n\nDistances derived from (real-life) gene or protein sequences are burdened with noise. Such data can\neither be modeled by simulating sequences, or by disturbing the distances specified by a given tree\ndirectly. This module implements functions for the latter alternative.",

      "doc": "This script simulates Symbiont trees inside of Host trees.\n\nParameters:\n- host_n_species: a list of integers; the number of species in host trees.\n                  The length of the list (N_h) determines the number of host trees to simulate.\n\n- symbiont_DTL_rates: a list of list of floats; ech sublist contains duplication/loss/transfer rates for symbiont inside of a host.\n                   Each of the N_r sublist will be used for all of the host trees.\n\n- n_simulations: an integer (N_s); the number of independent simulations for a given set of parameters (host tree size and DTL rates).\n\n- transfer_distance_bias: List; each of the N_db elements specifies whether closer related species have a higher probability to be the recipient species in a HGT event. (see https://david-schaller.de/docs/asymmetree/treeevolve/GeneTree.html)\n\n- replace_prob: List; each of the N_rp elements indicates probability for replacing HGT events. (see https://david-schaller.de/docs/asymmetree/treeevolve/GeneTree.html)\n\nIn total, this script will generate N_h * N_r * N_s * N_db * N_rp evolutionary scenarios.\nNote, there will be N_h unique host trees, each containing N_r * N_s * N_db * N_rp guest trees.",

    const svg = document.getElementById("graph");
    const viewport = document.getElementById("viewport");
    const searchInput = document.getElementById("search");
    const showExternal = document.getElementById("showExternal");
    const showPrivate = document.getElementById("showPrivate");
    const showStructure = document.getElementById("showStructure");
    const resetViewButton = document.getElementById("resetView");
    const clearSelectionButton = document.getElementById("clearSelection");
    const statsPanel = document.getElementById("stats");
    const detailsPanel = document.getElementById("details");
    const legend = document.getElementById("legend");

    const laneMap = new Map(graph.lanes.map((lane) => [lane.name, lane]));
    const nodeMap = new Map(graph.nodes.map((node) => [node.id, node]));
    const outgoing = new Map();
    const incoming = new Map();

    for (const edge of graph.edges) {
      if (!outgoing.has(edge.source)) {
        outgoing.set(edge.source, []);
      }
      if (!incoming.has(edge.target)) {
        incoming.set(edge.target, []);
      }
      outgoing.get(edge.source).push(edge);
      incoming.get(edge.target).push(edge);
    }

    let selectedId = graph.defaultSelection || null;
    let transform = {
      x: 24,
      y: 24,
      scale: 1
    };
    let isDragging = false;
    let dragOrigin = null;

    function updateLegend() {
      legend.innerHTML = "";
      for (const lane of graph.lanes) {
        const row = document.createElement("div");
        row.className = "legend-row";
        row.innerHTML = `
          <span class="swatch" style="background:${lane.color}"></span>
          <span>${lane.label}</span>
        `;
        legend.appendChild(row);
      }
    }

    function passesFilters(node, query) {
      if (!showExternal.checked && node.external) {
        return false;
      }
      if (!showPrivate.checked && node.private) {
        return false;
      }
      if (!query) {
        return true;
      }
      const haystack = `${node.label} ${node.fullName} ${node.module} ${node.doc}`.toLowerCase();
      return haystack.includes(query);
    }

    function render() {
      const query = searchInput.value.trim().toLowerCase();
      const visibleNodes = new Map();
      for (const node of graph.nodes) {
        if (passesFilters(node, query)) {
          visibleNodes.set(node.id, node);
        }
      }

      const visibleEdges = graph.edges.filter((edge) => {
        if (!visibleNodes.has(edge.source) || !visibleNodes.has(edge.target)) {
          return false;
        }
        if (!showStructure.checked && ["contains", "imports", "reexports"].includes(edge.type)) {
          return false;
        }
        return true;
      });

      const highlight = new Set();
      const highlightEdges = new Set();
      if (selectedId && visibleNodes.has(selectedId)) {
        highlight.add(selectedId);
        for (const edge of outgoing.get(selectedId) || []) {
          if (visibleNodes.has(edge.target)) {
            highlight.add(edge.target);
            highlightEdges.add(edge);
          }
        }
        for (const edge of incoming.get(selectedId) || []) {
          if (visibleNodes.has(edge.source)) {
            highlight.add(edge.source);
            highlightEdges.add(edge);
          }
        }
      }

      const maxX = Math.max(...graph.lanes.map((lane) => lane.x + lane.width + 36), 1600);
      const maxY = Math.max(...graph.nodes.map((node) => node.y + node.height + 96), 1000);
      svg.setAttribute("viewBox", `0 0 ${maxX} ${maxY}`);
      viewport.innerHTML = "";

      for (const lane of graph.lanes) {
        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("x", lane.x);
        rect.setAttribute("y", 36);
        rect.setAttribute("width", lane.width);
        rect.setAttribute("height", maxY - 72);
        rect.setAttribute("fill", lane.band);
        rect.setAttribute("class", "lane-band");
        viewport.appendChild(rect);

        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", lane.x + 18);
        text.setAttribute("y", 62);
        text.setAttribute("class", "lane-label");
        text.textContent = lane.label;
        viewport.appendChild(text);
      }

      for (const edge of visibleEdges) {
        const source = visibleNodes.get(edge.source);
        const target = visibleNodes.get(edge.target);
        const sameLane = source.lane === target.lane;
        const startX = source.x + source.width / 2;
        const endX = target.x - target.width / 2;
        const startY = source.y;
        const endY = target.y;
        const bend = sameLane ? 120 : Math.max(80, Math.abs(endX - startX) * 0.24);
        const controlX = sameLane ? startX + bend : (startX + endX) / 2;
        const controlY = sameLane ? (startY + endY) / 2 : (startY + endY) / 2;

        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute(
          "d",
          `M ${startX} ${startY} Q ${controlX} ${controlY} ${endX} ${endY}`
        );
        path.setAttribute("class", `edge ${edge.type}`);
        if (selectedId && highlight.size > 0 && !highlightEdges.has(edge)) {
          path.classList.add("dimmed");
        }
        if (highlightEdges.has(edge)) {
          path.classList.add("selected-edge");
        }
        const title = document.createElementNS("http://www.w3.org/2000/svg", "title");
        const linePart = edge.lines.length ? ` line${edge.lines.length > 1 ? "s" : ""} ${edge.lines.join(", ")}` : "";
        title.textContent = `${edge.type}: ${edge.label || "relation"}${linePart}`;
        path.appendChild(title);
        viewport.appendChild(path);
      }

      for (const node of visibleNodes.values()) {
        const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
        group.setAttribute("class", `node ${node.kind}`);
        group.dataset.id = node.id;
        if (selectedId === node.id) {
          group.classList.add("selected");
        } else if (selectedId && highlight.size > 0 && !highlight.has(node.id)) {
          group.classList.add("dimmed");
        }

        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("x", node.x - node.width / 2);
        rect.setAttribute("y", node.y - node.height / 2);
        rect.setAttribute("width", node.width);
        rect.setAttribute("height", node.height);
        rect.setAttribute("rx", node.kind === "module" ? 18 : 14);
        rect.setAttribute("fill", node.kind === "module" ? node.color : "white");
        rect.setAttribute("stroke", node.color);
        rect.setAttribute("class", "node-rect");
        group.appendChild(rect);

        const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
        label.setAttribute("x", node.x);
        label.setAttribute("y", node.y);
        label.setAttribute("class", "node-label");
        label.textContent = node.label;
        group.appendChild(label);

        const title = document.createElementNS("http://www.w3.org/2000/svg", "title");
        title.textContent = `${node.fullName}${node.lineno ? ` (line ${node.lineno})` : ""}`;
        group.appendChild(title);

        group.addEventListener("click", (event) => {
          event.stopPropagation();
          selectedId = node.id;
          updateDetails(node, visibleNodes);
          render();
        });
        viewport.appendChild(group);
      }

      updateStats(visibleNodes.size, visibleEdges.length);
      if (selectedId && visibleNodes.has(selectedId)) {
        updateDetails(visibleNodes.get(selectedId), visibleNodes);
      } else {
        renderHint();
      }

      applyTransform();
    }

    function updateStats(nodeCount, edgeCount) {
      statsPanel.innerHTML = `
        <strong>${nodeCount}</strong> visible nodes<br>
        <strong>${edgeCount}</strong> visible edges<br>
        <span class="hint">Calls and constructors define reachability. Import and containment edges provide structure.</span>
      `;
    }

    function updateDetails(node, visibleNodes) {
      const callers = (incoming.get(node.id) || [])
        .filter((edge) => visibleNodes.has(edge.source))
        .map((edge) => `${nodeMap.get(edge.source).label} [${edge.type}]`);
      const callees = (outgoing.get(node.id) || [])
        .filter((edge) => visibleNodes.has(edge.target))
        .map((edge) => `${nodeMap.get(edge.target).label} [${edge.type}]`);
      const fileLine = node.path && node.lineno ? `${node.path}:${node.lineno}` : "external / inferred";

      detailsPanel.innerHTML = `
        <h2>${node.label}</h2>
        <ul class="meta">
          <li><strong>Kind:</strong> ${node.kind}</li>
          <li><strong>Module:</strong> ${node.module}</li>
          <li><strong>Source:</strong> ${fileLine}</li>
          <li><strong>Full name:</strong> ${node.fullName}</li>
        </ul>
        <p>${node.doc || "No docstring available."}</p>
        <p><strong>Callers / parents</strong></p>
        <ul class="list">
          ${callers.length ? callers.map((entry) => `<li>${entry}</li>`).join("") : "<li>None visible</li>"}
        </ul>
        <p><strong>Callees / children</strong></p>
        <ul class="list">
          ${callees.length ? callees.map((entry) => `<li>${entry}</li>`).join("") : "<li>None visible</li>"}
        </ul>
      `;
    }

    function renderHint() {
      detailsPanel.innerHTML = `
        <h2>Selection</h2>
        <p class="hint">
          Click a node to inspect its neighborhood. Search narrows the graph; hiding external nodes
          is useful when you want to concentrate on the script, <code>asymmetree.hologenome</code>,
          and <code>asymmetree.holoevolve</code>.
        </p>
      `;
    }

    function applyTransform() {
      viewport.setAttribute(
        "transform",
        `translate(${transform.x}, ${transform.y}) scale(${transform.scale})`
      );
    }

    svg.addEventListener("click", () => {
      selectedId = null;
      render();
    });

    svg.addEventListener("pointerdown", (event) => {
      if (event.target.closest(".node")) {
        return;
      }
      isDragging = true;
      dragOrigin = { x: event.clientX, y: event.clientY, tx: transform.x, ty: transform.y };
      svg.classList.add("dragging");
    });

    window.addEventListener("pointermove", (event) => {
      if (!isDragging || !dragOrigin) {
        return;
      }
      transform.x = dragOrigin.tx + (event.clientX - dragOrigin.x);
      transform.y = dragOrigin.ty + (event.clientY - dragOrigin.y);
      applyTransform();
    });

    window.addEventListener("pointerup", () => {
      isDragging = false;
      dragOrigin = null;
      svg.classList.remove("dragging");
    });

    svg.addEventListener("wheel", (event) => {
      event.preventDefault();
      const direction = event.deltaY < 0 ? 1.08 : 0.92;
      transform.scale = Math.max(0.4, Math.min(2.8, transform.scale * direction));
      applyTransform();
    }, { passive: false });

    resetViewButton.addEventListener("click", () => {
      transform = { x: 24, y: 24, scale: 1 };
      applyTransform();
    });

    clearSelectionButton.addEventListener("click", () => {
      selectedId = null;
      render();
    });

    searchInput.addEventListener("input", render);
    showExternal.addEventListener("change", render);
    showPrivate.addEventListener("change", render);
    showStructure.addEventListener("change", render);

    updateLegend();
    render();
  </script>
