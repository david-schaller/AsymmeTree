name: Deploy docs

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Determine site URL
        id: target
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "site_url=https://david-schaller.github.io/AsymmeTree/" >> "$GITHUB_OUTPUT"
          else
            echo "site_url=https://david-schaller.github.io/AsymmeTree/dev/" >> "$GITHUB_OUTPUT"
          fi
      - run: uv sync --group docs
      - run: uv run mkdocs build
        env:
          MKDOCS_SITE_URL: ${{ steps.target.outputs.site_url }}
      - name: Push to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -b gh-pages pages-branch
          git -C pages-branch remote add origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          # Restore existing gh-pages content so neither main nor dev wipes the other
          git -C pages-branch fetch --depth=1 origin gh-pages && git -C pages-branch checkout FETCH_HEAD -- . || true
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            # Sync root, deleting stale files but preserving dev/
            rsync -a --delete --exclude=dev site/ pages-branch/
          else
            rm -rf pages-branch/dev
            cp -r site/ pages-branch/dev
          fi
          touch pages-branch/.nojekyll
          cd pages-branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy AsymmeTree docs (${{ github.ref_name }})"
          git push --force origin HEAD:gh-pages
