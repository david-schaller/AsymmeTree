site_name: AsymmeTree
site_description: Simulation of phylogenetic trees, sequences and genomes
site_url: !ENV [MKDOCS_SITE_URL, 'https://david-schaller.github.io/AsymmeTree/']
repo_url: https://github.com/david-schaller/AsymmeTree
repo_name: david-schaller/AsymmeTree

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_signature_annotations: true
            members_order: source
            show_root_heading: true
            show_root_full_path: false

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation: installation.md
  - User Guide:
    - Overview: guide/index.md
    - Preliminaries: guide/preliminaries.md
    - Phylogenetic Tree Simulation:
      - Overview: guide/phylogenetic_trees.md
      - Species Tree Simulation: guide/species_trees.md
      - Gene Tree Simulation: guide/gene_trees.md
    - Sequence Simulation: guide/sequence_simulation.md
    - Genome Simulation: guide/genome_simulation.md
    - Additional features: guide/additional_features.md
    - Visualization: guide/visualization.md
  - API Reference:
    - treeevolve: api/treeevolve.md
    - seqevolve: api/seqevolve.md
    - genome: api/genome.md
    - analysis: api/analysis.md
    - utils: api/utils.md
    - io: api/io.md
    - visualization: api/visualization.md
  - Citation: citation.md
